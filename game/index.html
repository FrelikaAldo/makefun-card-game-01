<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBER &amp; ASH — a lane duel against THE CINDER</title>
<meta name="description" content="A two-player lane duel for the browser. Three lanes, twenty life, four suits told apart by colour and shape.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23120b0e'/%3E%3Cpath d='M16 6l9 18H7z' fill='%23ff7a2f'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    background: #060405;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #table {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    box-shadow: 0 0 120px rgba(255, 122, 47, 0.16), 0 0 0 1px rgba(255, 150, 90, 0.10);
    outline: none;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <canvas id="table" width="1280" height="720" role="img"
          aria-label="EMBER AND ASH: a three-lane card duel against THE CINDER. Your hand sits along the bottom, the Cinder's cards face down along the top, and three lanes sit between you."></canvas>
  <p id="status" role="status" aria-live="polite">Title screen. Press Enter to duel THE CINDER.</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
